<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <title>MyPlanner- schedule accordingly!</title>
  </head>
  <body>
    <header class="sidebar">
      <nav class="navbar">
        <p class="logo">
          CampusPlanner <button class="menu-button">Menu</button>
        </p>
        <ul class="menu">
          <li><a href="../index.html" class="nav-link">Dashboard</a></li>
          <li><a href="#" class="active nav-link">MyPlanner</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="settings.html" class="nav-link">Settings</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="hero">
        <div class="welcome">
          <h2>MyPlanner</h2>
          <p>Manage your schedules, tasks, and other campus activities!</p>
        </div>
        <button><a href="addRecord.html">+Schedule</a></button>
      </div>
      <div class="schedules">
        <input
          type="text"
          class="search"
          placeholder="Search by activity, tag, date, ..."
        />
        <div class="sort">
          <p>Sort by:</p>
          <button>All</button>
          <button>A-Z</button>
          <button>Date</button>
          <select name="" id="">
            <option value="" class="invalid">Completion status</option>
            <option value="">Not yet completed</option>
            <option value="">Completed</option>
          </select>
        </div>
        <div class="" id="myPlanner-card">
          <div class="upcoming" id="myPlanner">
            <div class="activity">
              <input type="checkbox" name="" id="" />
              <div class="activity-description">
                <h3>Planned activity</h3>
                <p>Tag</p>
              </div>
              <p>Duration</p>
              <p>Due date</p>
              <div class="action">
                <button>Edit</button>
                <button>Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <hr />
      <footer>
        <center>©2026 - SHEMA Alain Bruno</center>
      </footer>
    </main>
    <script type="module" src="../scripts/main.js"></script>
  </body>
</html>
