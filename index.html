<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Life Planner</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
    <header class="sidebar">
      <nav class="navbar">
        <p class="logo">
          CampusPlanner
          <button class="menu-button">Menu</button>
        </p>
        <ul class="menu">
          <li><a href="#" class="active nav-link">Dashboard</a></li>
          <li><a href="assets/myPlanner.html" class="nav-link">MyPlanner</a></li>
          <li><a href="assets/about.html" class="nav-link">About</a></li>
          <li><a href="assets/settings.html" class="nav-link">Settings</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <div class="hero">
          <div class="welcome">
            <h2>Welcome Again!</h2>
            <p>Here is your campus life plan so far!</p>
          </div>
          <button><a href="#">+Schedule</a></button>
        </div>
        <div class="card-section">
          <div class="hero-cards">
            <div class="card">
              <h3>Upcoming</h3>
              <p>0</p>
            </div>
            <div class="card">
              <h3>Completed</h3>
              <p>0</p>
            </div>
            <div class="card">
              <h3>Total Schedules</h3>
              <p>0</p>
            </div>
          </div>
          <div class="upcoming">
            <div class="title">
              <h2>Upcoming Schedules</h2>
              <p>sort</p>
            </div>
            <div class="activity">
              <div class="activity-description">
                <h3>Planned activity</h3>
                <p>Tag</p>
              </div>
              <p>Due date</p>
            </div>
            <button>View all Schedules -></button>
          </div>
        </div>
        <div class="history-section">
          <h2>Last 7 days Schedule structure</h2>
          <p>No plan yet</p>
        </div>
      </section>
      <hr />
      <footer>
        <center>©2026 - SHEMA Alain Bruno</center>
      </footer>
    </main>
</body>
</html>
